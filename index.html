<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>العقرب / Scorpion</title>
  <style>
    :root {
      --bg: #050912;
      --surface: rgba(12, 19, 34, 0.92);
      --card: rgba(17, 27, 46, 0.94);
      --gold: #f6c445;
      --sky: #38bdf8;
      --red: #fb7185;
      --yellow: #fde047;
      --white: #f8fafc;
      --muted: #94a3b8;
      --wa: #22c55e;
      --wa-deep: #16a34a;
      --border: rgba(246, 196, 69, 0.3);
    }

    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--white);
      min-height: 100vh;
      padding-bottom: 50px;
      overflow-x: hidden;
      position: relative;
    }

    .fx-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background:
        radial-gradient(circle at 8% 12%, rgba(56, 189, 248, 0.28), transparent 36%),
        radial-gradient(circle at 92% 16%, rgba(251, 113, 133, 0.26), transparent 38%),
        radial-gradient(circle at 85% 88%, rgba(246, 196, 69, 0.28), transparent 40%),
        radial-gradient(circle at 14% 90%, rgba(253, 224, 71, 0.22), transparent 36%);
    }

    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(42px);
      opacity: 0.6;
      animation: pulseOrb 7s ease-in-out infinite alternate;
    }
    .orb-blue { width: 240px; height: 240px; background: rgba(56, 189, 248, 0.48); top: -60px; left: -60px; }
    .orb-red { width: 230px; height: 230px; background: rgba(244, 63, 94, 0.45); top: 12%; right: -70px; animation-delay: 1.5s; }
    .orb-gold { width: 260px; height: 260px; background: rgba(245, 190, 65, 0.48); bottom: -80px; left: 18%; animation-delay: 3s; }
    .orb-yellow { width: 210px; height: 210px; background: rgba(250, 204, 21, 0.4); bottom: 8%; right: -60px; animation-delay: 2s; }

    .edge-circle {
      position: absolute;
      border-radius: 50%;
      border: 2px solid;
      opacity: 0.55;
    }
    .ec-1 { width: 76px; height: 76px; border-color: var(--sky); top: 16%; left: -26px; animation: driftLeft 9s ease-in-out infinite; }
    .ec-2 { width: 58px; height: 58px; border-color: var(--red); top: 54%; right: -18px; animation: driftRight 10s ease-in-out infinite; }
    .ec-3 { width: 90px; height: 90px; border-color: var(--gold); bottom: -30px; left: 12%; animation: driftUp 11s ease-in-out infinite; }
    .ec-4 { width: 50px; height: 50px; border-color: var(--yellow); top: 8%; right: 22%; animation: driftDown 8.5s ease-in-out infinite; }

    .edge-tri {
      position: absolute;
      width: 0;
      height: 0;
      opacity: 0.56;
      filter: drop-shadow(0 0 8px rgba(246, 196, 69, 0.4));
    }
    .et-1 { border-left: 18px solid transparent; border-right: 18px solid transparent; border-bottom: 32px solid var(--gold); top: 28%; right: -8px; transform: rotate(-28deg); animation: triRight 8.5s ease-in-out infinite; }
    .et-2 { border-left: 16px solid transparent; border-right: 16px solid transparent; border-bottom: 28px solid var(--red); bottom: 22%; left: -6px; transform: rotate(34deg); animation: triLeft 9.5s ease-in-out infinite; }
    .et-3 { border-left: 15px solid transparent; border-right: 15px solid transparent; border-bottom: 26px solid var(--sky); bottom: -8px; right: 24%; transform: rotate(-12deg); animation: triUp 10s ease-in-out infinite; }
    .et-4 { border-left: 14px solid transparent; border-right: 14px solid transparent; border-bottom: 24px solid var(--yellow); top: -6px; left: 34%; transform: rotate(155deg); animation: triDown 9s ease-in-out infinite; }

    @keyframes pulseOrb { 0% { transform: scale(0.95); opacity: 0.45; } 100% { transform: scale(1.12); opacity: 0.68; } }
    @keyframes driftLeft { 0%, 100% { transform: translateX(0) scale(1); } 50% { transform: translateX(26px) scale(1.08); } }
    @keyframes driftRight { 0%, 100% { transform: translateX(0) scale(1); } 50% { transform: translateX(-24px) scale(1.08); } }
    @keyframes driftUp { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-26px) scale(1.06); } }
    @keyframes driftDown { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(20px) scale(1.06); } }
    @keyframes triRight { 0%, 100% { transform: translate(0, 0) rotate(-28deg); } 50% { transform: translate(-22px, -14px) rotate(-10deg); } }
    @keyframes triLeft { 0%, 100% { transform: translate(0, 0) rotate(34deg); } 50% { transform: translate(22px, -16px) rotate(52deg); } }
    @keyframes triUp { 0%, 100% { transform: translate(0, 0) rotate(-12deg); } 50% { transform: translate(12px, -24px) rotate(10deg); } }
    @keyframes triDown { 0%, 100% { transform: translate(0, 0) rotate(155deg); } 50% { transform: translate(-12px, 22px) rotate(135deg); } }

    header, main, nav {
      position: relative;
      z-index: 2;
    }

    header {
      background: var(--surface);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 13px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 30;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .logo-ring {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      padding: 2.5px;
      background: linear-gradient(135deg, var(--sky), var(--gold), var(--red), var(--yellow));
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.4), 0 0 18px rgba(246, 196, 69, 0.35);
      flex-shrink: 0;
    }

    .logo-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #070d19;
      color: var(--gold);
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .logo-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }

    header h1#store-title {
      margin: 0;
      font-size: 1.18rem;
      font-weight: 900;
      background: linear-gradient(90deg, var(--gold), var(--yellow), var(--sky));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
      user-select: none;
    }

    .social-links {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .tiktok-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      text-decoration: none;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.96), rgba(30, 41, 59, 0.96));
      color: #ffffff;
      border: 1px solid rgba(56, 189, 248, 0.7);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 0.84rem;
      font-weight: 800;
      box-shadow: 0 4px 16px rgba(56, 189, 248, 0.25);
    }

    .insta-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      text-decoration: none;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.96), rgba(30, 41, 59, 0.96));
      color: #ffffff;
      border: 1px solid rgba(251, 113, 133, 0.7);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 0.84rem;
      font-weight: 800;
      box-shadow: 0 4px 16px rgba(251, 113, 133, 0.25);
    }

    /* ===== الأقسام ===== */
    .cats {
      max-width: 1140px;
      margin: 16px auto 0;
      padding: 0 14px;
      display: flex;
      gap: 9px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .cats::-webkit-scrollbar { display: none; }

    .cat-btn {
      flex-shrink: 0;
      white-space: nowrap;
      background: var(--surface);
      color: var(--white);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 9px 18px;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .cat-btn:active { transform: scale(0.96); }
    .cat-btn.active {
      background: linear-gradient(135deg, var(--gold), #eab308);
      color: #090d16;
      border-color: transparent;
      box-shadow: 0 4px 16px rgba(246, 196, 69, 0.35);
    }

    .grid {
      max-width: 1140px;
      margin: 16px auto 20px;
      padding: 0 14px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
    }

    .media-box {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #040811;
      overflow: hidden;
    }
    .media-box img,
    .media-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .pid-tag {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(5, 9, 18, 0.86);
      color: var(--sky);
      border: 1px solid rgba(56, 189, 248, 0.45);
      padding: 3px 9px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 800;
    }
    .cat-tag {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(5, 9, 18, 0.86);
      color: var(--gold);
      border: 1px solid rgba(246, 196, 69, 0.45);
      padding: 3px 9px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 800;
    }

    .card-body {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }
    .p-name { margin: 0; font-size: 1.06rem; font-weight: 800; }
    .p-price { font-size: 1.22rem; font-weight: 900; color: var(--gold); }

    .wa-btn {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      background: linear-gradient(135deg, var(--wa), var(--wa-deep));
      color: #ffffff;
      font-weight: 800;
      font-size: 0.92rem;
      padding: 11px 14px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(34, 197, 94, 0.3);
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      color: var(--muted);
      font-size: 1rem;
      font-weight: 700;
    }

    #secretAdminModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 15, 0.82);
      backdrop-filter: blur(8px);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .admin-box {
      width: 100%;
      max-width: 450px;
      background: #0c1424;
      border: 1px solid var(--border);
      border-top: 3px solid var(--gold);
      border-radius: 18px;
      padding: 20px;
      color: var(--white);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.55);
      max-height: 90vh;
      overflow-y: auto;
    }

    .admin-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .admin-head h3 {
      margin: 0;
      font-size: 1.05rem;
      color: var(--gold);
    }

    .admin-close {
      background: rgba(251, 113, 133, 0.16);
      color: var(--red);
      border: 1px solid rgba(251, 113, 133, 0.4);
      border-radius: 9px;
      padding: 5px 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .admin-label {
      display: block;
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--sky);
      margin-bottom: 5px;
    }

    .admin-input,
    .admin-select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: #060b14;
      color: var(--white);
      margin-bottom: 11px;
      font-size: 0.92rem;
    }

    .admin-btn-sky {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--sky), #0284c7);
      color: #04101c;
      font-weight: 900;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .admin-btn-gold {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--gold), #eab308);
      color: #090d16;
      font-weight: 900;
      cursor: pointer;
    }

    .media-note {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: -6px;
      margin-bottom: 10px;
    }

    .admin-msg {
      margin-top: 8px;
      font-size: 0.82rem;
      text-align: center;
      min-height: 18px;
      word-break: break-word;
    }

    .admin-items {
      margin-top: 10px;
      max-height: 160px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .admin-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: rgba(17, 27, 46, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.16);
      padding: 7px 10px;
      border-radius: 10px;
      font-size: 0.84rem;
    }

    .admin-del {
      background: rgba(251, 113, 133, 0.2);
      color: var(--red);
      border: 1px solid rgba(251, 113, 133, 0.4);
      border-radius: 8px;
      padding: 4px 9px;
      font-weight: 800;
      cursor: pointer;
    }

    /* ===== نافذة اختيار القسم ===== */
    #catPickModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 15, 0.85);
      backdrop-filter: blur(8px);
      z-index: 10000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .cat-pick-box {
      width: 100%;
      max-width: 380px;
      background: #0c1424;
      border: 1px solid var(--border);
      border-top: 3px solid var(--gold);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.55);
    }
    .cat-pick-box h3 {
      margin: 0 0 14px;
      text-align: center;
      color: var(--gold);
      font-size: 1.1rem;
    }
    .cat-pick-opt {
      width: 100%;
      padding: 13px;
      margin-bottom: 9px;
      border-radius: 12px;
      border: 1px solid rgba(56, 189, 248, 0.5);
      background: rgba(17, 27, 46, 0.9);
      color: var(--white);
      font-size: 0.98rem;
      font-weight: 800;
      cursor: pointer;
    }
    .cat-pick-opt:active { background: rgba(56, 189, 248, 0.25); }
    .cat-pick-cancel {
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid rgba(251, 113, 133, 0.4);
      background: rgba(251, 113, 133, 0.14);
      color: var(--red);
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>

    const GH_OWNER = "kitre14234478";
    const GH_REPO = "ashallak";
    const GH_BRANCH = "main";
    const GH_FILE_PATH = "products.json";
    const STORE_JSON_URL = `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/${GH_BRANCH}/${GH_FILE_PATH}`;

    const MAX_VIDEO_BYTES = 18 * 1024 * 1024;

    // الأقسام (id يُحفظ مع المنتج في الحقل category)
    const CATEGORIES = [
      { id: "casual",  label: "كاجوال" },
      { id: "classic", label: "كلاسيكي" },
      { id: "custom",  label: "طباعة حسب الطلب" },
      { id: "offers",  label: "عروضنا" }
    ];

    function categoryLabel(id) {
      const c = CATEGORIES.find(x => x.id === id);
      return c ? c.label : "";
    }

    let products = [];
    let lastSignature = "";
    let isUnlocked = false;
    let adminPassword = "";
    let selectedMediaFile = null;
    let currentCat = "all";
    let pendingProduct = null;

    function formatMB(bytes) {
      return (bytes / (1024 * 1024)).toFixed(2) + " MB";
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function getProductsSignature(list) {
      return JSON.stringify(
        list.map(item => ({
          id: item.id || item.seq || "",
          seq: item.seq || "",
          type: item.type || "",
          url: item.url || "",
          name: item.name || "",
          price: item.price || "",
          category: item.category || ""
        }))
      );
    }

    function isAnyVideoPlaying() {
      const videos = document.querySelectorAll("#storeGrid video");
      for (const v of videos) {
        if (!v.paused && !v.ended) return true;
      }
      return false;
    }

    function extractProductsList(data) {
      if (Array.isArray(data)) return data;
      if (data && Array.isArray(data.products)) return data.products;
      if (data && typeof data === "object") {
        return Object.values(data).filter(v => v && typeof v === "object" && "name" in v);
      }
      return [];
    }

    async function loadProducts() {
      try {
        const res = await fetch(`${STORE_JSON_URL}?t=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) return;
        const data = await res.json();
        const nextList = extractProductsList(data);

        const nextSignature = getProductsSignature(nextList);
        if (nextSignature === lastSignature) return;
        if (isAnyVideoPlaying()) return;

        lastSignature = nextSignature;
        products = nextList;
        render();
        renderAdminItems();
      } catch (err) {
        console.error("Load products error:", err);
      }
    }

    function renderTabs() {
      const bar = document.getElementById("catsBar");
      if (!bar) return;
      const tabs = [{ id: "all", label: "الكل" }, ...CATEGORIES];
      bar.innerHTML = tabs.map(t =>
        `<button class="cat-btn${t.id === currentCat ? " active" : ""}" onclick="setCategory('${t.id}')">${t.label}</button>`
      ).join("");
    }

    function setCategory(id) {
      currentCat = id;
      renderTabs();
      render();
    }

    function render() {
      const grid = document.getElementById("storeGrid");
      if (!grid) return;

      let list = [...products]
        .filter(item => item && typeof item === "object")
        .sort((a, b) => Number(a.seq || a.id || 0) - Number(b.seq || b.id || 0))
        .reverse();

      if (currentCat !== "all") {
        list = list.filter(item => item.category === currentCat);
      }

      if (list.length === 0) {
        grid.innerHTML = `<div class="empty">${currentCat === "all" ? "لا يوجد عروض لهذا اليوم" : "لا توجد منتجات في هذا القسم حالياً"}</div>`;
        return;
      }

      grid.innerHTML = list.map(item => {
        const safeId = escapeHtml(item.id || item.seq || "");
        const safeName = escapeHtml(item.name || "منتج");
        const safePrice = escapeHtml(item.price || "");
        const safeUrl = escapeHtml(item.url || "");
        const catName = categoryLabel(item.category);

        const media = item.type === "video"
          ? `<video src="${safeUrl}" controls playsinline preload="auto"></video>`
          : (safeUrl ? `<img src="${safeUrl}" alt="${safeName}" loading="lazy" />` : "");

        const waText = encodeURIComponent(
          `مرحباً متجر العقرب، أريد طلب المنتج:\n• الاسم: ${item.name || "منتج"}\n• السعر: ${item.price || ""}\n• الرقم: #${item.id || item.seq || ""}`
        );
        const waUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${waText}`;

        return `
          <article class="card">
            <div class="media-box">
              <span class="pid-tag">#${safeId}</span>
              ${catName ? `<span class="cat-tag">${escapeHtml(catName)}</span>` : ""}
              ${media}
            </div>
            <div class="card-body">
              <h2 class="p-name">${safeName}</h2>
              <div class="p-price">${safePrice}</div>
              <a class="wa-btn" href="${waUrl}" target="_blank" rel="noopener noreferrer">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M20.52 3.48A11.82 11.82 0 0 0 12.04 0C5.46 0 .1 5.36.1 11.94c0 2.1.55 4.16 1.6 5.97L0 24l6.26-1.64a11.9 11.9 0 0 0 5.78 1.48h.01c6.58 0 11.94-5.36 11.94-11.94 0-3.19-1.24-6.19-3.48-8.42zM12.05 21.8h-.01a9.87 9.87 0 0 1-5.03-1.38l-.36-.21-3.72.97.99-3.63-.24-.37a9.85 9.85 0 0 1-1.51-5.22c0-5.45 4.44-9.89 9.9-9.89 2.64 0 5.12 1.03 6.99 2.9a9.82 9.82 0 0 1 2.9 7c0 5.45-4.44 9.89-9.89 9.89zm5.43-7.41c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.95 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.8.37-.27.3-1.05 1.03-1.05 2.5 0 1.48 1.08 2.91 1.23 3.11.15.2 2.12 3.24 5.14 4.54.72.31 1.28.5 1.72.64.72.23 1.38.2 1.9.12.58-.09 1.76-.72 2.01-1.41.25-.69.25-1.29.17-1.41-.07-.12-.27-.2-.57-.35z"/>
                </svg>
                <span>طلب عبر واتساب</span>
              </a>
            </div>
          </article>
        `;
      }).join("");
    }

    function handleFileSelection(event) {
      const file = event.target.files && event.target.files[0];
      const note = document.getElementById("fileInfoNote");
      const status = document.getElementById("adminStatusMsg");
      const typeSelect = document.getElementById("prodTypeSelect");

      selectedMediaFile = null;
      status.textContent = "";

      if (!file) {
        note.style.color = "var(--muted)";
        note.textContent = "يمكنك اختيار ملف من جهازك أو وضع رابط مباشر بالأسفل.";
        return;
      }

      const isVideo = file.type.startsWith("video/") || /\.(mp4|mov|webm|mkv|avi)$/i.test(file.name || "");
      typeSelect.value = isVideo ? "video" : "image";

      if (isVideo && file.size > MAX_VIDEO_BYTES) {
        event.target.value = "";
        note.style.color = "var(--red)";
        note.textContent = `حجم الفيديو (${formatMB(file.size)}) أكبر من 18MB؛ الفيديو كبير ويجب تصغيره أولاً.`;
        status.style.color = "var(--red)";
        status.textContent = "الفيديو أكبر من 18 ميغا، يرجى تصغير حجمه ثم إعادة اختياره.";
        return;
      }

      selectedMediaFile = file;
      note.style.color = "var(--wa)";
      note.textContent = `تم اختيار الملف (${formatMB(file.size)}) وجاهز للرفع.`;
    }

    let tapCount = 0;
    let tapTimer = null;

    document.getElementById("store-title").addEventListener("click", () => {
      tapCount++;
      clearTimeout(tapTimer);
      if (tapCount >= 3) {
        tapCount = 0;
        openAdminModal();
      } else {
        tapTimer = setTimeout(() => {
          tapCount = 0;
        }, 750);
      }
    });

    function openAdminModal() {
      document.getElementById("secretAdminModal").style.display = "flex";
      if (!isUnlocked) {
        document.getElementById("adminAuthBox").style.display = "block";
        document.getElementById("adminPanelBox").style.display = "none";
        document.getElementById("adminPassInput").value = "";
        document.getElementById("adminAuthMsg").textContent = "";
      } else {
        document.getElementById("adminAuthBox").style.display = "none";
        document.getElementById("adminPanelBox").style.display = "block";
        renderAdminItems();
      }
    }

    function closeAdminModal() {
      document.getElementById("secretAdminModal").style.display = "none";
    }

    function verifyAdminPassword() {
      const pass = document.getElementById("adminPassInput").value.trim();
      const msg = document.getElementById("adminAuthMsg");

      if (!pass) {
        msg.style.color = "var(--red)";
        msg.textContent = "يرجى إدخال كلمة السر.";
        return;
      }

      adminPassword = pass;
      isUnlocked = true;
      document.getElementById("adminAuthBox").style.display = "none";
      document.getElementById("adminPanelBox").style.display = "block";
      renderAdminItems();
    }

    function arrayBufferToBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      const chunkSize = 0x8000;
      let bin = "";
      for (let i = 0; i < bytes.length; i += chunkSize) {
        bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
      }
      return btoa(bin);
    }

    async function callWorker(payload) {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          password: adminPassword,
          ...payload
        })
      });

      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.ok) {
        if (res.status === 401) {
          isUnlocked = false;
          adminPassword = "";
          document.getElementById("adminPanelBox").style.display = "none";
          document.getElementById("adminAuthBox").style.display = "block";
          document.getElementById("adminAuthMsg").textContent = data.error || "كلمة السر غير صحيحة.";
        }
        throw new Error(data.error || `Request failed (${res.status})`);
      }
      return data;
    }

    async function uploadMediaFileToWorker(file) {
      const buffer = await file.arrayBuffer();
      const base64Content = arrayBufferToBase64(buffer);
      const extMatch = (file.name || "").match(/\.[a-zA-Z0-9]+$/);
      const ext = extMatch ? extMatch[0].toLowerCase() : (file.type.startsWith("video/") ? ".mp4" : ".jpg");
      const fileName = `${Date.now()}_${Math.random().toString(36).slice(2, 7)}${ext}`;

      const data = await callWorker({
        action: "upload",
        fileName,
        base64Content
      });

      return data.url;
    }

    /* الخطوة 1: التحقق من الحقول ثم إظهار نافذة اختيار القسم */
    function saveProductToGitHub() {
      const status = document.getElementById("adminStatusMsg");
      const name = document.getElementById("prodNameInput").value.trim();
      const price = document.getElementById("prodPriceInput").value.trim();
      const type = document.getElementById("prodTypeSelect").value;
      const finalUrl = document.getElementById("prodUrlInput").value.trim();

      if (!name) {
        status.style.color = "var(--red)";
        status.textContent = "يرجى إدخال اسم المنتج.";
        return;
      }

      if (selectedMediaFile && type === "video" && selectedMediaFile.size > MAX_VIDEO_BYTES) {
        status.style.color = "var(--red)";
        status.textContent = `الفيديو (${formatMB(selectedMediaFile.size)}) أكبر من 18MB؛ يرجى تصغيره أولاً.`;
        return;
      }

      if (!selectedMediaFile && !finalUrl) {
        status.style.color = "var(--red)";
        status.textContent = "اختر صورة/فيديو من الجهاز أو أدخل رابطاً مباشراً.";
        return;
      }

      status.textContent = "";
      pendingProduct = { name, price, type };
      openCatPick();
    }

    function openCatPick() {
      document.getElementById("catPickOptions").innerHTML = CATEGORIES.map(c =>
        `<button class="cat-pick-opt" onclick="publishWithCategory('${c.id}')">${c.label}</button>`
      ).join("");
      document.getElementById("catPickModal").style.display = "flex";
    }

    function closeCatPick() {
      document.getElementById("catPickModal").style.display = "none";
      pendingProduct = null;
    }

    /* الخطوة 2: النشر الفعلي بعد اختيار القسم (نفس طريقة الرفع السابقة + حقل category) */
    async function publishWithCategory(category) {
      if (!pendingProduct) return;
      const { name, price, type } = pendingProduct;
      document.getElementById("catPickModal").style.display = "none";
      pendingProduct = null;

      const btn = document.getElementById("saveProdBtn");
      const status = document.getElementById("adminStatusMsg");
      const urlInput = document.getElementById("prodUrlInput");
      let finalUrl = urlInput.value.trim();

      btn.disabled = true;
      status.style.color = "var(--sky)";

      try {
        if (selectedMediaFile) {
          status.textContent = "جاري رفع الملف...";
          finalUrl = await uploadMediaFileToWorker(selectedMediaFile);
          urlInput.value = finalUrl;
        }

        status.textContent = "جاري حفظ المنتج...";
        const data = await callWorker({
          action: "add",
          name,
          price,
          type,
          category,
          url: finalUrl
        });

        products = Array.isArray(data.products) ? data.products : products;
        lastSignature = getProductsSignature(products);
        render();
        renderAdminItems();

        document.getElementById("prodNameInput").value = "";
        document.getElementById("prodPriceInput").value = "";
        document.getElementById("prodFileInput").value = "";
        document.getElementById("prodUrlInput").value = "";
        document.getElementById("fileInfoNote").style.color = "var(--muted)";
        document.getElementById("fileInfoNote").textContent = "يمكنك اختيار ملف من جهازك أو وضع رابط مباشر بالأسفل.";
        selectedMediaFile = null;

        status.style.color = "var(--wa)";
        status.textContent = `تم نشر المنتج في قسم "${categoryLabel(category)}" بنجاح.`;
      } catch (err) {
        console.error(err);
        status.style.color = "var(--red)";
        status.textContent = `تعذر النشر: ${err && err.message ? err.message : "خطأ غير معروف"}`;
      } finally {
        btn.disabled = false;
      }
    }

    async function deleteProductFromGitHub(id) {
      if (!confirm("هل تريد حذف هذا المنتج؟")) return;
      const status = document.getElementById("adminStatusMsg");
      status.style.color = "var(--sky)";
      status.textContent = "جاري الحذف...";

      try {
        const data = await callWorker({
          action: "delete",
          id
        });

        products = Array.isArray(data.products) ? data.products : products.filter(item => String(item.id || item.seq || "") !== String(id));
        lastSignature = getProductsSignature(products);
        render();
        renderAdminItems();

        status.style.color = "var(--wa)";
        status.textContent = "تم حذف المنتج بنجاح.";
      } catch (err) {
        console.error(err);
        status.style.color = "var(--red)";
        status.textContent = `تعذر الحذف: ${err && err.message ? err.message : "خطأ غير معروف"}`;
      }
    }

    function renderAdminItems() {
      const box = document.getElementById("adminItemsList");
      if (!box) return;
      if (!products.length) {
        box.innerHTML = `<div style="color:var(--muted);font-size:0.82rem;">لا توجد منتجات حالياً.</div>`;
        return;
      }
      box.innerHTML = products.map(item => {
        const idVal = item.id || item.seq || "";
        const cat = categoryLabel(item.category);
        return `
          <div class="admin-row">
            <span>#${escapeHtml(idVal)} — ${escapeHtml(item.name || "منتج")} (${escapeHtml(item.price || "")})${cat ? ` — ${escapeHtml(cat)}` : ""}</span>
            <button class="admin-del" onclick="deleteProductFromGitHub('${escapeHtml(idVal)}')">حذف</button>
          </div>
        `;
      }).join("");
    }

    renderTabs();
    render();
    loadProducts();
    setInterval(loadProducts, 60000);
  </script>

</body>
</html>
